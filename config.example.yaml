# Example configuration for knowledge-base-mcp.
# Copy to config.yaml (git-ignored) or set the equivalent KB_* environment variables.
# Environment variables take precedence over this file.

vault:
  # Absolute path to the server's private Git clone of the knowledge base.
  # In a container this is a mounted volume; if it is empty, `remote` is cloned into it.
  path: /data/vault
  # Git remote to clone on first start. Credentials come from Git itself:
  # either a mounted SSH key or an HTTPS token in KB_GIT_TOKEN. Never from this file.
  remote: ""            # e.g. git@github.com:me/my-notes.git
  # Extra glob patterns to hide from all tools (in addition to built-in defaults).
  exclude: []           # e.g. ["Private/**", "*.log"]

git:
  branch: main
  # Dedicated identity so edits made through the server are visible in history.
  author_name: Knowledge Base MCP
  author_email: kb-mcp@localhost
  # Stable identifier of this instance, written as a commit trailer. Generated if empty.
  instance_id: ""
  auto_push: true
  push_debounce: 5s
  pull_interval: 60s
  # Skip pull-before-write if a pull succeeded this recently.
  pull_freshness: 5s
  # Merge conflicts are committed with Git's standard markers and listed in kb_sync_status;
  # a client resolves them with the normal write tools. There is nothing to configure.

search:
  # Where the full-text index lives. Must be outside the vault (second volume in a container).
  index_dir: /data/index
  languages: [ru, en]
  # Skip files larger than this in kb_grep.
  grep_max_file_size: 2MB

server:
  read_only: false
  log_level: info
