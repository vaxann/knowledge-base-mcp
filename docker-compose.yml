# Long-running knowledge-base-mcp instance reachable over streamable HTTP with
# a bearer token. Copy .env.example to .env and fill it in, then:
#   docker compose up -d --build     # first start clones the vault
#   docker compose logs -f kb
#   docker compose build --pull && docker compose up -d   # rebuild after changes
services:
  kb:
    build:
      context: .
      args:
        VERSION: ${KB_VERSION:-compose}
    image: knowledge-base-mcp:local
    container_name: knowledge-base-mcp
    restart: unless-stopped
    environment:
      # Required for the classic single-vault server; optional in multi-user
      # mode, where repositories can also be added in the admin panel. The
      # server itself reports what is missing.
      KB_GIT_REMOTE: ${KB_GIT_REMOTE:-}
      KB_GIT_BRANCH: ${KB_GIT_BRANCH:-main}
      KB_HTTP_LISTEN: 0.0.0.0:8765
      # Bearer token (openssl rand -hex 32). Required for the classic server;
      # in multi-user mode it is the optional recovery token of the administrator.
      KB_HTTP_TOKEN: ${KB_HTTP_TOKEN:-}
      # Password typed on the OAuth sign-in page (Claude apps). Falls back to KB_HTTP_TOKEN.
      KB_OAUTH_PASSWORD: ${KB_OAUTH_PASSWORD:-}
      # Public base URL when behind a proxy/tunnel, e.g. https://kb.example.com.
      # Optional: derived from X-Forwarded-Proto/Host when empty.
      KB_PUBLIC_URL: ${KB_PUBLIC_URL:-}
      KB_GIT_TOKEN: ${KB_GIT_TOKEN:-}
      KB_LOG_LEVEL: ${KB_LOG_LEVEL:-info}
      KB_PULL_INTERVAL: ${KB_PULL_INTERVAL:-60s}
      KB_INSTANCE_ID: ${KB_INSTANCE_ID:-compose}
      KB_READ_ONLY: ${KB_READ_ONLY:-false}
      # Multi-user mode (docs/multi-user.md): leave KB_ADMIN_EMAIL empty for
      # the classic server. State and added repositories live on the index
      # volume (/data/index) unless KB_DATA_DIR says otherwise.
      KB_ADMIN_EMAIL: ${KB_ADMIN_EMAIL:-}
      KB_RESEND_API_KEY: ${KB_RESEND_API_KEY:-}
      KB_MAIL_FROM: ${KB_MAIL_FROM:-}
      KB_SECRET_KEY: ${KB_SECRET_KEY:-}
      KB_VAULT_ALIAS: ${KB_VAULT_ALIAS:-main}
      # known_hosts lines trusted for SSH remotes (default: GitHub for the
      # mounted key, first-contact pinning for repositories added in the panel).
      KB_SSH_KNOWN_HOSTS: ${KB_SSH_KNOWN_HOSTS:-}
    ports:
      # Bind to loopback by default; put a TLS reverse proxy (Caddy, nginx,
      # Traefik) or a private network (Tailscale, WireGuard) in front of it
      # before changing this to 0.0.0.0.
      - "${KB_BIND:-127.0.0.1}:${KB_PORT:-8765}:8765"
    volumes:
      - kb-vault:/data/vault
      - kb-index:/data/index
      # SSH deploy key with write access to the vault repository (optional if
      # KB_GIT_TOKEN is used with an HTTPS remote).
      - ${KB_SSH_KEY_FILE:-/dev/null}:/run/secrets/ssh_key:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  kb-vault:
    name: kb-vault
  kb-index:
    name: kb-index
